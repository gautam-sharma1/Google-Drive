spring.application.name=Eureka

# by default port is 8761 if we not give
server.port=8761

#do not register with itself  means eureka client register service in it but eureka it self a code so below line is for that it not register with itself
eureka.client.register-with-eureka=false
# above line This tells the application:
#“Do NOT register yourself as a client inside Eureka.”
#Normally, microservices register themselves to the Eureka Server.
#But the Eureka Server itself does not need to register to itself.
eureka.client.fetch-registry=false
#This tells the application:
#“Do NOT fetch the list of registered services from Eureka.”
#A normal microservice fetches the registry to know which services are available.
#But the Eureka Server already maintains the registry, so it doesn’t need to fetch it.