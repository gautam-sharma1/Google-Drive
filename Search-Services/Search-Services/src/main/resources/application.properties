spring.application.name=Search-Services
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ─── CIRCUIT BREAKER ───────────────────────────────────────────
resilience4j.circuitbreaker.instances.file-service.failure-rate-threshold=10
# above line is for at what percent like here if 50% request fail the fileservice become down
resilience4j.circuitbreaker.instances.file-service.minimum-number-of-calls=2
# above line is for at minimum 5 calls if 5 calls to specific service fail then file system got down 5 se jyada req fail hui toh enter into open state
resilience4j.circuitbreaker.instances.file-service.wait-duration-in-open-state=10s
# above line is for at in open state the service stay for  10 minute 5000=5min,10000=10min
resilience4j.circuitbreaker.instances.file-service.permitted-number-of-calls-in-half-open-state=3
# above line is for like in half open state  it allow only 3 calls for testing not all
resilience4j.circuitbreaker.instances.file-service.automatic-transition-from-open-to-half-open-enabled=true
# above line is for automatically when service fail it enter  from open to half open state
spring.cloud.openfeign.circuitbreaker.enabled=true
# above line is for like fiegn client ke through circuit breaker ko enable kar diya we are enabling circuit breaker through feign client that is what we can see on  filesearchclient fallbackFactory = FileSearchClientFallbackFactory.class
 # application.properties

resilience4j.circuitbreaker.instances.folder-service.failure-rate-threshold=10
resilience4j.circuitbreaker.instances.folder-service.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.folder-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.folder-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.folder-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.file-service.record-exceptions=java.io.IOException,feign.FeignException,feign.RetryableException
resilience4j.circuitbreaker.instances.file-service.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException
#Tells circuit breaker "myCircuitBreaker" to COUNT these 2 exceptions as failures:
#1. java.io.IOException (network error)
#2. java.util.concurrent.TimeoutException (timeout error)
# the above lien is not necessary to put

feign.client.config.default.retryer=feign.Retryer.NEVER
#the above line we are writting because feign client is register with the eureka so when the service fail then feign try to call the service  that is it working  so it basically interfering so by this line we are avoiding that
logging.level.com.drive.search=DEBUG
logging.level.io.github.resilience4j=DEBUG
#line number 18 ka meaning 🔥 What this line means
#resilience4j.circuitbreaker.instances.file-service.record-exceptions=
#java.io.IOException,
#feign.FeignException,
#feign.RetryableException
#
#👉 This tells Resilience4j (Circuit Breaker):
#
#“These exceptions should be treated as FAILURES.”
#
#🧠 Meaning in simple language
#
#Whenever your Feign call fails, Spring may throw different types of exceptions.
#
#This line says:
#
#✔ Treat these as failures:
#1. java.io.IOException
#
#👉 Network problem (server down, connection issue)
#
#2. feign.FeignException
#
#👉 HTTP error from remote service
#Example:
#
#404 Not Found
#500 Internal Server Error
#3. feign.RetryableException
#
#👉 Feign could not connect (your case: Connection refused)