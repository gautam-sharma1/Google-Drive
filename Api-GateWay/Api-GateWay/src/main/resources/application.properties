spring.application.name=Api-GateWay
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# all service are for gate way is like array or array that i
#is why they started from index - 0 toh we are creating routing ka first index ,routing ka second index
#routes to user service(lb://enable load balancing) //when we write lb://dfbip that means enable load balancing
spring.cloud.gateway.routes[0].id=user-service
# above line is only for like it is just an id
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
#to this route USER-SERVICE toh lb://dffsdh means load balancer is activated
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
# above line is for when someone hit this url  then api gateway redirects it to see 12
#predicate mae zero isisliye because  routing ka first index  and index ke andar ek aur index which start from 0
#routes to user service(lb://enable load balancing)
spring.cloud.gateway.routes[1].id=order-service
# above line is only for like it is just an id
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
#  to this route ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**
# above line is for when someone hit this url  then api gateway redirects it to see 12
# routing table means ke andar  array of array user service routing is [0] index  pe hai and uske ander perdicate  bhi [0] index pe hai
# and then order service ke liye routes to order service  we have to write lb configuration and in oreder service routing  woh [1] index  pe hai and uske ander predicate  [0] index pe hai

#  Actuator
management.endpoints.web.exposure.include=*
logging.level.root=debug