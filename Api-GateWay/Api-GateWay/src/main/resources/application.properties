spring.application.name=Api-GateWay
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# routes to File-Services (lb:// enables Eureka-based load balancing)
spring.cloud.gateway.routes[0].id=file-services
spring.cloud.gateway.routes[0].uri=lb://FILE-SERVICES
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/files/**

# routes to Search-Services
spring.cloud.gateway.routes[1].id=search-services
spring.cloud.gateway.routes[1].uri=lb://SEARCH-SERVICES
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/search/**

# routes to folder-services
spring.cloud.gateway.routes[2].id=folder-services
spring.cloud.gateway.routes[2].uri=lb://FOLDER-SERVICES
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/folders/**

#  Actuator
#management.endpoints.web.exposure.include=* old: exposed every actuator endpoint (env, beans, heapdump, etc.) unprotected
management.endpoints.web.exposure.include=health,info
logging.level.root=debug